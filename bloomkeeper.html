// ---- random.js (deps: none) ----
// A small seeded random generator (mulberry32) so a ?seed=N run is repeatable:
// the same seed always grows the same garden and the same wasp pattern.

function createRandom(seed) {
  let state = seed >>> 0;
  return function random() {
    state = (state + 0x6d2b79f5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

/** Pick a value in [min, max) from the seeded generator. */
function range(random, min, max) {
  return min + random() * (max - min);
}

// ---- audio.js (deps: none) ----
// Sound effects are synthesised with WebAudio, and the background music is
// one looping theme track shipped with the game
// (game/assets/bloomkeeper-theme.mp3, an original chiptune composed for it),
// so the game still makes no network request. Sounds start only after the
// player presses a key or clicks, which is when browsers allow audio.

function createAudio() {
  let context = null;
  let muted = false;
  let music = null;
  let musicStarted = false;

  function ensureMusic() {
    if (music === null) {
      try {
        music = new Audio(MUSIC_DATA_URI);
        music.loop = true;
        music.volume = 0.45;
        music.muted = muted;
        music.style.display = 'none';
        document.body.appendChild(music);
      } catch {
        music = null;
      }
    }
    return music;
  }

  function ensure() {
    if (context === null) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        context = new AudioContext();
      } catch {
        context = null;
      }
    }
    if (context !== null && context.state === 'suspended') context.resume();
    return context;
  }

  function tone(frequency, seconds, type, volume, when) {
    const ctx = ensure();
    if (ctx === null || muted) return;
    const start = ctx.currentTime + (when || 0);
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + seconds);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  }

  function sweep(fromFrequency, toFrequency, seconds, type, volume) {
    const ctx = ensure();
    if (ctx === null || muted) return;
    const start = ctx.currentTime;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(fromFrequency, start);
    oscillator.frequency.exponentialRampToValueAtTime(toFrequency, start + seconds);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + seconds);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  }

  return {
    unlock() { ensure(); },
    startMusic() {
      if (musicStarted) return;
      const track = ensureMusic();
      if (track === null) return;
      musicStarted = true;
      const play = track.play();
      if (play && typeof play.catch === 'function') play.catch(() => { musicStarted = false; });
    },
    toggleMute() { muted = !muted; if (music !== null) music.muted = muted; return muted; },
    isMuted() { return muted; },
    collect() { tone(880, 0.12, 'sine', 0.12); tone(1320, 0.1, 'sine', 0.08, 0.05); },
    bloom() { tone(523, 0.14, 'triangle', 0.14); tone(659, 0.14, 'triangle', 0.14, 0.08); tone(784, 0.2, 'triangle', 0.14, 0.16); },
    sting() { sweep(220, 70, 0.3, 'sawtooth', 0.16); },
    dash() { sweep(300, 900, 0.16, 'sine', 0.08); },
    shield() { tone(440, 0.2, 'sine', 0.12); tone(660, 0.25, 'sine', 0.1, 0.1); },
    win() { [523, 659, 784, 1047].forEach((frequency, index) => tone(frequency, 0.3, 'triangle', 0.15, index * 0.13)); },
    lose() { [392, 330, 262].forEach((frequency, index) => tone(frequency, 0.3, 'triangle', 0.13, index * 0.16)); },
  };
}

// ---- world.js (deps: config.js, random.js) ----
// Bloomkeeper's rules and state, with no drawing and no browser in it:
// Pip the bee, the garden's flowers, drifting pollen, chasing wasps,
// power-ups, the daylight timer, score, hearts and combos. step() advances
// one fixed step and returns what happened as bit flags, so the caller can
// react (and play sounds) without the world knowing about screens or sound.




const EVENT_COLLECT = 1;
const EVENT_BLOOM = 2;
const EVENT_HIT = 4;
const EVENT_OVER = 8;
const EVENT_WIN = 16;
const EVENT_POWERUP = 32;
const EVENT_DASH = 64;

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function createWorld(random) {
  const bee = {
    x: FIELD.width / 2, y: FIELD.height / 2, vx: 0, vy: 0,
    invulnerable: 0, shield: false, swift: 0, dashTime: 0, dashCooldown: 0,
    facing: 1, wing: 0,
  };
  const flowers = [];
  const pollen = [];
  const wasps = [];
  const powerups = [];
  const particles = [];
  const state = {
    bee, flowers, pollen, wasps, powerups, particles,
    score: 0, hearts: HEARTS, blooms: 0, pollenCarried: 0,
    combo: 0, comboTimer: 0, elapsed: 0, level: 1,
    pollenTimer: 0.4, waspTimer: 5, powerupTimer: POWERUP.interval,
    won: false, over: false, overReason: '',
  };

  function scatterFlowers() {
    flowers.length = 0;
    const cols = 4;
    const rows = 3;
    for (let index = 0; index < FLOWERS_TOTAL; index += 1) {
      const col = index % cols;
      const row = Math.floor(index / cols);
      const x = 110 + col * 360 + range(random, -70, 70);
      const y = 130 + row * 150 + range(random, -45, 45);
      flowers.push({
        x, y, bloomed: false, bloomAnim: 0, progress: 0,
        hue: FLOWER_HUES[index % FLOWER_HUES.length], sway: random() * Math.PI * 2,
      });
    }
  }

  function reset() {
    bee.x = FIELD.width / 2;
    bee.y = FIELD.height / 2;
    bee.vx = 0; bee.vy = 0;
    bee.invulnerable = 0; bee.shield = false; bee.swift = 0;
    bee.dashTime = 0; bee.dashCooldown = 0;
    scatterFlowers();
    pollen.length = 0;
    wasps.length = 0;
    powerups.length = 0;
    particles.length = 0;
    state.score = 0;
    state.hearts = HEARTS;
    state.blooms = 0;
    state.pollenCarried = 0;
    state.combo = 0;
    state.comboTimer = 0;
    state.elapsed = 0;
    state.level = 1;
    state.pollenTimer = 0.4;
    state.waspTimer = 5;
    state.powerupTimer = POWERUP.interval;
    state.won = false;
    state.over = false;
    state.overReason = '';
  }

  function burst(x, y, color, count, speed) {
    for (let index = 0; index < count; index += 1) {
      if (particles.length >= POOL_SIZE) return;
      const angle = random() * Math.PI * 2;
      const velocity = range(random, speed * 0.3, speed);
      particles.push({
        x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity,
        life: range(random, 0.4, 0.9), maxLife: 0.9, color, size: range(random, 2, 5),
      });
    }
  }

  function spawnPollen() {
    let active = 0;
    for (const puff of pollen) if (puff.active) active += 1;
    if (active >= POLLEN.maxOnField) return;
    pollen.push({
      active: true, x: range(random, 60, FIELD.width - 60),
      y: range(random, 90, FIELD.groundY - 60),
      phase: random() * Math.PI * 2, bob: 0,
    });
  }

  function spawnWasp() {
    let active = 0;
    for (const wasp of wasps) if (wasp.active) active += 1;
    if (active >= WASP.maxOnField) return;
    const fromLeft = random() < 0.5;
    wasps.push({
      active: true,
      x: fromLeft ? -30 : FIELD.width + 30,
      y: range(random, 80, FIELD.groundY - 80),
      vx: 0, vy: 0, wobble: random() * Math.PI * 2, life: WASP.lifetime,
      speed: Math.min(WASP.maxSpeed, WASP.speed + WASP.speedPerBloom * state.blooms),
    });
  }

  function spawnPowerup() {
    const kind = POWERUP.kinds[Math.floor(random() * POWERUP.kinds.length)];
    powerups.push({
      active: true, kind,
      x: range(random, 80, FIELD.width - 80),
      y: range(random, 100, FIELD.groundY - 80), phase: 0,
    });
  }

  function nearestUnbloomedFlower() {
    let best = null;
    let bestDistance = Infinity;
    for (const flower of flowers) {
      if (flower.bloomed) continue;
      const d = distance(bee, flower);
      if (d < bestDistance) { bestDistance = d; best = flower; }
    }
    return best;
  }

  function nearestPollen() {
    let best = null;
    let bestDistance = Infinity;
    for (const puff of pollen) {
      if (!puff.active) continue;
      const d = distance(bee, puff);
      if (d < bestDistance) { bestDistance = d; best = puff; }
    }
    return best;
  }

  function nearestWasp() {
    let best = null;
    let bestDistance = Infinity;
    for (const wasp of wasps) {
      if (!wasp.active) continue;
      const d = distance(bee, wasp);
      if (d < bestDistance) { bestDistance = d; best = wasp; }
    }
    return best;
  }

  /**
   * One fixed step. `steer` is a unit {x, y} direction or null (drift to a
   * stop); `dash` asks for a burst of speed if its cooldown has passed.
   * With `harmless` set (the title screen's backdrop) wasps never sting and
   * nothing scores.
   */
  function step(dt, steer, dash, harmless) {
    let events = 0;
    state.elapsed += dt;
    state.level = Math.min(LEVEL.max, 1 + Math.floor(state.elapsed / LEVEL.seconds));
    if (state.comboTimer > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) state.combo = 0;
    }

    const speed = BEE.speed * (bee.swift > 0 ? BEE.swiftMultiplier : 1);
    if (dash && bee.dashCooldown <= 0 && steer !== null) {
      bee.dashTime = BEE.dashSeconds;
      bee.dashCooldown = BEE.dashCooldown;
      events |= EVENT_DASH;
    }
    if (bee.dashCooldown > 0) bee.dashCooldown -= dt;
    if (bee.swift > 0) bee.swift -= dt;
    if (bee.invulnerable > 0) bee.invulnerable -= dt;

    const moving = bee.dashTime > 0 ? BEE.dashSpeed : speed;
    if (bee.dashTime > 0) bee.dashTime -= dt;
    if (steer !== null) {
      bee.vx = steer.x * moving;
      bee.vy = steer.y * moving;
      if (steer.x !== 0) bee.facing = steer.x > 0 ? 1 : -1;
    } else {
      bee.vx *= 0.86;
      bee.vy *= 0.86;
    }
    bee.x = Math.min(FIELD.width - BEE.radius, Math.max(BEE.radius, bee.x + bee.vx * dt));
    bee.y = Math.min(FIELD.groundY - BEE.radius, Math.max(70, bee.y + bee.vy * dt));
    bee.wing += dt * (steer === null ? 14 : 30);

    // Pollen drifts in and is collected on touch.
    state.pollenTimer -= dt;
    if (state.pollenTimer <= 0) {
      spawnPollen();
      state.pollenTimer = POLLEN.interval + random() * POLLEN.intervalJitter;
    }
    for (const puff of pollen) {
      if (!puff.active) continue;
      puff.bob += dt;
      puff.y += Math.sin(puff.bob * 2) * POLLEN.drift * dt * 0.3;
      if (!harmless && distance(bee, puff) < BEE.radius + POLLEN.radius + 6) {
        puff.active = false;
        state.pollenCarried += 1;
        if (!harmless) state.score += POLLEN_POINTS;
        burst(puff.x, puff.y, '#ffd94d', 8, 90);
        events |= EVENT_COLLECT;
      }
    }

    // A bud blooms when the bee lingers on it while carrying pollen:
    // pollination takes 1.0 s of contact, so a wasp can catch a bee that
    // stays too long. Progress fades if the bee flies away.
    for (const flower of flowers) {
      if (flower.bloomed) {
        if (flower.bloomAnim < 1) flower.bloomAnim = Math.min(1, flower.bloomAnim + dt * 2);
        continue;
      }
      if (!harmless && state.pollenCarried >= POLLEN_PER_BLOOM && distance(bee, flower) < BEE.radius + 26) {
        flower.progress = Math.min(1, flower.progress + dt / 1.0);
      } else if (flower.progress > 0) {
        flower.progress = Math.max(0, flower.progress - dt * 0.5);
      }
      if (!harmless && flower.progress >= 1) {
        flower.bloomed = true;
        flower.bloomAnim = 0.2;
        state.pollenCarried -= POLLEN_PER_BLOOM;
        state.blooms += 1;
        state.combo = state.comboTimer > 0 ? state.combo + 1 : 1;
        state.comboTimer = COMBO_WINDOW;
        state.score += BLOOM_POINTS + (state.combo - 1) * COMBO_BONUS;
        burst(flower.x, flower.y - 20, flower.hue, 16, 140);
        burst(flower.x, flower.y - 20, '#ffd94d', 8, 100);
        events |= EVENT_BLOOM;
        if (state.blooms >= FLOWERS_TOTAL) {
          state.won = true;
          state.over = true;
          state.overReason = 'win';
          state.score += Math.max(0, Math.ceil(DAYLIGHT_SECONDS - state.elapsed)) * 10;
          events |= EVENT_WIN | EVENT_OVER;
          return events;
        }
      }
    }

    // Wasps arrive over time and chase the bee.
    state.waspTimer -= dt;
    if (state.waspTimer <= 0) {
      spawnWasp();
      const interval = Math.max(WASP.minInterval, WASP.interval * (WASP.intervalScale ** (state.level - 1)));
      state.waspTimer = interval;
    }
    for (const wasp of wasps) {
      if (!wasp.active) continue;
      wasp.life -= dt;
      if (wasp.life <= 0) { wasp.active = false; continue; }
      wasp.wobble += dt * 2;
      const dx = bee.x - wasp.x;
      const dy = bee.y - wasp.y;
      const length = Math.hypot(dx, dy) || 1;
      const wobbleX = Math.cos(wasp.wobble) * 30;
      wasp.vx += ((dx / length) * wasp.speed + wobbleX - wasp.vx) * Math.min(1, WASP.turn * dt);
      wasp.vy += ((dy / length) * wasp.speed - wasp.vy) * Math.min(1, WASP.turn * dt);
      wasp.x += wasp.vx * dt;
      wasp.y += wasp.vy * dt;
      if (wasp.x < -60 || wasp.x > FIELD.width + 60 || wasp.y < -60 || wasp.y > FIELD.height + 60) {
        wasp.active = false;
        continue;
      }
      if (!harmless && bee.invulnerable <= 0 && distance(bee, wasp) < BEE.radius + WASP.radius - 2) {
        wasp.active = false;
        if (bee.shield) {
          bee.shield = false;
          bee.invulnerable = BEE.invulnerable;
          burst(bee.x, bee.y, '#7fd4ff', 14, 160);
          events |= EVENT_HIT;
        } else {
          state.hearts -= 1;
          bee.invulnerable = BEE.invulnerable;
          state.combo = 0;
          state.comboTimer = 0;
          burst(bee.x, bee.y, '#e5534b', 14, 160);
          events |= EVENT_HIT;
          if (state.hearts <= 0) {
            state.over = true;
            state.overReason = 'stung';
            events |= EVENT_OVER;
            return events;
          }
        }
      }
    }

    // Power-ups: a shield that blocks one sting, or swift wings.
    state.powerupTimer -= dt;
    if (state.powerupTimer <= 0) {
      spawnPowerup();
      state.powerupTimer = POWERUP.interval;
    }
    for (const powerup of powerups) {
      if (!powerup.active) continue;
      powerup.phase += dt;
      if (!harmless && distance(bee, powerup) < BEE.radius + 18) {
        powerup.active = false;
        if (powerup.kind === 'shield') bee.shield = true;
        else bee.swift = BEE.swiftSeconds;
        burst(powerup.x, powerup.y, '#7fd4ff', 12, 120);
        events |= EVENT_POWERUP;
      }
    }

    // Daylight runs out: dusk ends the game unless every flower bloomed.
    if (!harmless && state.elapsed >= DAYLIGHT_SECONDS) {
      state.over = true;
      state.overReason = 'dusk';
      events |= EVENT_OVER;
      return events;
    }

    for (const particle of particles) {
      particle.life -= dt;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vx *= 0.98;
      particle.vy *= 0.98;
    }

    return events;
  }

  reset();
  return {
    state, reset, step,
    nearestUnbloomedFlower, nearestPollen, nearestWasp,
  };
}

// ---- input.js (deps: none) ----
// Keyboard and pointer input. Held keys give a steering direction; one-shot
// presses (start, restart, pause, dash, mute) are queued as bit flags and
// taken once by the loop, so a press between two frames is never lost and
// never counted twice. The mouse steers too: while the pointer is held the
// bee flies toward it, and a click also dashes.

const ACTION_CONFIRM = 1;
const ACTION_PAUSE = 2;
const ACTION_DASH = 4;
const ACTION_MUTE = 8;

const UP = new Set(['ArrowUp', 'KeyW']);
const DOWN = new Set(['ArrowDown', 'KeyS']);
const LEFT = new Set(['ArrowLeft', 'KeyA']);
const RIGHT = new Set(['ArrowRight', 'KeyD']);
const CONFIRM = new Set(['Space', 'Enter']);
const PAUSE = new Set(['KeyP', 'Escape']);
const DASH = new Set(['ShiftLeft', 'ShiftRight', 'KeyJ']);
const MUTE = new Set(['KeyM']);

function createInput(target) {
  let up = false;
  let down = false;
  let left = false;
  let right = false;
  let actions = 0;
  let pointerDown = false;
  let pointerX = 0;
  let pointerY = 0;

  window.addEventListener('keydown', (event) => {
    if (UP.has(event.code)) up = true;
    else if (DOWN.has(event.code)) down = true;
    else if (LEFT.has(event.code)) left = true;
    else if (RIGHT.has(event.code)) right = true;
    else if (CONFIRM.has(event.code)) {
      if (!event.repeat) actions |= ACTION_CONFIRM;
    } else if (PAUSE.has(event.code)) {
      if (!event.repeat) actions |= ACTION_PAUSE;
    } else if (DASH.has(event.code)) {
      if (!event.repeat) actions |= ACTION_DASH;
    } else if (MUTE.has(event.code)) {
      if (!event.repeat) actions |= ACTION_MUTE;
    } else return;
    event.preventDefault();
  });
  window.addEventListener('keyup', (event) => {
    if (UP.has(event.code)) up = false;
    else if (DOWN.has(event.code)) down = false;
    else if (LEFT.has(event.code)) left = false;
    else if (RIGHT.has(event.code)) right = false;
  });
  window.addEventListener('blur', () => {
    up = false; down = false; left = false; right = false; pointerDown = false;
  });

  function trackPointer(event) {
    const rect = target.getBoundingClientRect();
    pointerX = event.clientX - rect.left;
    pointerY = event.clientY - rect.top;
  }
  target.addEventListener('pointerdown', (event) => {
    trackPointer(event);
    pointerDown = true;
    actions |= ACTION_CONFIRM | ACTION_DASH;
  });
  target.addEventListener('pointermove', trackPointer);
  target.addEventListener('pointerup', () => { pointerDown = false; });
  target.addEventListener('pointerleave', () => { pointerDown = false; });

  return {
    /** {x, y} steering in -1..1 from the keys, or null when no key is held. */
    keyDirection() {
      const x = (right ? 1 : 0) - (left ? 1 : 0);
      const y = (down ? 1 : 0) - (up ? 1 : 0);
      if (x === 0 && y === 0) return null;
      const length = Math.hypot(x, y);
      return { x: x / length, y: y / length };
    },
    pointerActive() { return pointerDown; },
    pointerPosition() { return { x: pointerX, y: pointerY }; },
    /** The one-shot presses since the last call, as ACTION_* flags. */
    takeActions() {
      const taken = actions;
      actions = 0;
      return taken;
    },
  };
}

// ---- render.js (deps: config.js, world.js) ----
// Drawing only: the world's state and the current screen in, pixels out.
// The 1280x720 playfield is scaled to fit the window and centred, the margin
// filled with the backdrop colour. The garden is drawn fresh every frame:
// sky and sun, grass, flowers opening petal by petal, the bee and wasps,
// pollen sparkles, particles, and a HUD that reads at a glance.




const SCREEN_TITLE = 'title';
const SCREEN_PLAY = 'play';
const SCREEN_PAUSED = 'paused';
const SCREEN_OVER = 'over';

const PANEL = { width: 640, top: 150, line: 32, bottom: 76 };

function cachedLabel(prefix) {
  let value = -1;
  let text = '';
  return function label(next) {
    if (next !== value) { value = next; text = prefix + next; }
    return text;
  };
}

function createRenderer(canvas) {
  const context = canvas.getContext('2d');
  const view = { scale: 1, x: 0, y: 0 };
  const scoreLabel = cachedLabel('Score ');
  const bestLabel = cachedLabel('Best ');
  const finalLabel = cachedLabel('Score ');
  const flowersLabel = cachedLabel('');

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const width = Math.round(window.innerWidth * ratio);
    const height = Math.round(window.innerHeight * ratio);
    canvas.width = width;
    canvas.height = height;
    view.scale = Math.min(width / FIELD.width, height / FIELD.height);
    view.x = (width - FIELD.width * view.scale) / 2;
    view.y = (height - FIELD.height * view.scale) / 2;
  }

  const fonts = new Map();
  function text(value, x, y, size, color, align) {
    if (!fonts.has(size)) fonts.set(size, `${size}px ${FONT}`);
    context.font = fonts.get(size);
    context.fillStyle = color;
    context.textAlign = align;
    // Callers set textBaseline before calling: 'top' for the HUD, 'alphabetic' for panels.
    context.fillText(value, x, y);
  }

  function drawSky(state) {
    const dusk = Math.min(1, state.elapsed / DAYLIGHT_SECONDS);
    const top = dusk < 0.75 ? PALETTE.skyTop : PALETTE.duskTop;
    const bottom = dusk < 0.75 ? PALETTE.skyBottom : PALETTE.duskBottom;
    const gradient = context.createLinearGradient(0, 0, 0, FIELD.height);
    gradient.addColorStop(0, top);
    gradient.addColorStop(1, bottom);
    context.fillStyle = gradient;
    context.fillRect(0, 0, FIELD.width, FIELD.height);
    // The sun arcs across the sky as daylight runs out.
    const sunX = 120 + (FIELD.width - 240) * dusk;
    const sunY = 150 - Math.sin(dusk * Math.PI) * 70;
    context.fillStyle = '#fff3b0';
    context.beginPath();
    context.arc(sunX, sunY, 34, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = 'rgba(255, 243, 176, 0.35)';
    context.beginPath();
    context.arc(sunX, sunY, 52, 0, Math.PI * 2);
    context.fill();
    // Drifting clouds.
    context.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (let index = 0; index < 3; index += 1) {
      const cx = ((state.elapsed * 8 + index * 430) % (FIELD.width + 240)) - 120;
      const cy = 70 + index * 46;
      context.beginPath();
      context.arc(cx, cy, 26, 0, Math.PI * 2);
      context.arc(cx + 28, cy - 8, 22, 0, Math.PI * 2);
      context.arc(cx + 56, cy, 24, 0, Math.PI * 2);
      context.fill();
    }
  }

  function drawGround(state) {
    context.fillStyle = PALETTE.grass;
    context.fillRect(0, FIELD.groundY, FIELD.width, FIELD.height - FIELD.groundY);
    context.fillStyle = PALETTE.grassDark;
    for (let x = 20; x < FIELD.width; x += 64) {
      context.beginPath();
      context.moveTo(x, FIELD.groundY + 30);
      context.lineTo(x + 8, FIELD.groundY + 8);
      context.lineTo(x + 16, FIELD.groundY + 30);
      context.fill();
    }
    context.fillStyle = PALETTE.soil;
    context.fillRect(0, FIELD.groundY - 4, FIELD.width, 6);
    void state;
  }

  function drawFlower(flower, time) {
    const sway = Math.sin(time * 1.4 + flower.sway) * 3;
    const stemX = flower.x + sway;
    context.strokeStyle = '#3e7d32';
    context.lineWidth = 4;
    context.beginPath();
    context.moveTo(flower.x, FIELD.groundY);
    context.quadraticCurveTo(flower.x + sway, (FIELD.groundY + flower.y) / 2, stemX, flower.y);
    context.stroke();
    const cx = stemX;
    const cy = flower.y;
    if (flower.bloomed) {
      const open = 10 + flower.bloomAnim * 10;
      context.fillStyle = flower.hue;
      for (let petal = 0; petal < 5; petal += 1) {
        const angle = (petal / 5) * Math.PI * 2 - Math.PI / 2;
        context.beginPath();
        context.ellipse(cx + Math.cos(angle) * open * 0.8, cy + Math.sin(angle) * open * 0.8, open * 0.62, open * 0.45, angle, 0, Math.PI * 2);
        context.fill();
      }
      context.fillStyle = '#ffd94d';
      context.beginPath();
      context.arc(cx, cy, 9, 0, Math.PI * 2);
      context.fill();
    } else {
      context.fillStyle = '#8fae7a';
      context.beginPath();
      context.arc(cx, cy, 9, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = '#6d8f5c';
      context.beginPath();
      context.arc(cx, cy - 4, 5, 0, Math.PI * 2);
      context.fill();
      if (flower.progress > 0) {
        context.strokeStyle = PALETTE.gold;
        context.lineWidth = 4;
        context.beginPath();
        context.arc(cx, cy, 18, -Math.PI / 2, -Math.PI / 2 + flower.progress * Math.PI * 2);
        context.stroke();
      }
    }
  }

  function drawBee(bee) {
    if (bee.invulnerable > 0 && Math.floor(bee.invulnerable * 10) % 2 === 0) return;
    const flap = Math.sin(bee.wing) * 0.5;
    context.fillStyle = 'rgba(255, 255, 255, 0.75)';
    context.beginPath();
    context.ellipse(bee.x - 4, bee.y - 14 - flap * 4, 12, 7, -0.5, 0, Math.PI * 2);
    context.ellipse(bee.x + 6, bee.y - 14 + flap * 4, 12, 7, 0.5, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = PALETTE.bee;
    context.beginPath();
    context.ellipse(bee.x, bee.y, BEE.radius, BEE.radius * 0.82, 0, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = PALETTE.beeStripe;
    context.fillRect(bee.x - 4, bee.y - BEE.radius * 0.7, 6, BEE.radius * 1.4);
    context.fillRect(bee.x + 5, bee.y - BEE.radius * 0.6, 5, BEE.radius * 1.2);
    context.fillStyle = '#1d1d1d';
    context.beginPath();
    context.arc(bee.x + bee.facing * 9, bee.y - 3, 2.5, 0, Math.PI * 2);
    context.fill();
    if (bee.shield) {
      context.strokeStyle = '#7fd4ff';
      context.lineWidth = 3;
      context.beginPath();
      context.arc(bee.x, bee.y, BEE.radius + 8, 0, Math.PI * 2);
      context.stroke();
    }
    if (bee.dashTime > 0) {
      context.fillStyle = 'rgba(255, 217, 77, 0.5)';
      context.beginPath();
      context.ellipse(bee.x - bee.facing * 22, bee.y, 14, 6, 0, 0, Math.PI * 2);
      context.fill();
    }
  }

  function drawWasp(wasp) {
    context.fillStyle = PALETTE.wasp;
    context.beginPath();
    context.ellipse(wasp.x, wasp.y, WASP.radius, WASP.radius * 0.8, 0, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = PALETTE.waspStripe;
    context.fillRect(wasp.x - 3, wasp.y - WASP.radius * 0.7, 5, WASP.radius * 1.4);
    context.fillRect(wasp.x + 5, wasp.y - WASP.radius * 0.6, 4, WASP.radius * 1.2);
    context.fillStyle = '#ff5a5a';
    context.beginPath();
    context.arc(wasp.x + 8, wasp.y - 2, 2.5, 0, Math.PI * 2);
    context.fill();
    context.strokeStyle = 'rgba(255,255,255,0.6)';
    context.lineWidth = 2;
    context.beginPath();
    context.ellipse(wasp.x - 4, wasp.y - 12, 9, 5, -0.5, 0, Math.PI * 2);
    context.stroke();
  }

  function drawField(state, time) {
    drawSky(state);
    drawGround(state);
    for (const flower of state.flowers) drawFlower(flower, time);
    for (const puff of state.pollen) {
      if (!puff.active) continue;
      const glow = 0.6 + Math.sin(puff.bob * 4) * 0.3;
      context.fillStyle = `rgba(255, 217, 77, ${glow})`;
      context.beginPath();
      context.arc(puff.x, puff.y, 14, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = PALETTE.pollen;
      context.beginPath();
      context.arc(puff.x, puff.y, 8, 0, Math.PI * 2);
      context.fill();
    }
    for (const powerup of state.powerups) {
      if (!powerup.active) continue;
      const bob = Math.sin(powerup.phase * 3) * 4;
      context.fillStyle = powerup.kind === 'shield' ? '#7fd4ff' : '#ff9f5a';
      context.beginPath();
      context.arc(powerup.x, powerup.y + bob, 15, 0, Math.PI * 2);
      context.fill();
      context.textBaseline = 'alphabetic';
      text(powerup.kind === 'shield' ? 'S' : '»', powerup.x, powerup.y + bob + 7, 20, '#20301c', 'center');
    }
    for (const wasp of state.wasps) if (wasp.active) drawWasp(wasp);
    for (const particle of state.particles) {
      if (particle.life <= 0) continue;
      context.fillStyle = particle.color;
      context.globalAlpha = Math.max(0, particle.life / particle.maxLife);
      context.beginPath();
      context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
      context.fill();
      context.globalAlpha = 1;
    }
    drawBee(state.bee);
  }

  function drawHud(state, best) {
    context.textBaseline = 'top';
    // A dark strip keeps the HUD readable over the bright sky.
    context.fillStyle = 'rgba(24, 40, 20, 0.55)';
    context.fillRect(0, 0, FIELD.width, 56);
    text(scoreLabel(state.score), 24, 14, 26, PALETTE.text, 'left');
    text(`Flowers ${state.blooms}/${FLOWERS_TOTAL}`, FIELD.width / 2 - 90, 14, 26, PALETTE.text, 'left');
    text(`Pollen ${state.pollenCarried}`, FIELD.width / 2 + 130, 14, 26, PALETTE.gold, 'left');
    if (state.combo > 1) text(`Combo x${state.combo}`, FIELD.width - 320, 14, 26, PALETTE.gold, 'left');
    const heartsX = FIELD.width - 24;
    for (let heart = 0; heart < 3; heart += 1) {
      context.fillStyle = heart < state.hearts ? '#ff6b81' : 'rgba(255,255,255,0.3)';
      const x = heartsX - (2 - heart) * 30;
      context.beginPath();
      context.arc(x - 5, 26, 7, 0, Math.PI * 2);
      context.arc(x + 5, 26, 7, 0, Math.PI * 2);
      context.fill();
      context.beginPath();
      context.moveTo(x - 11, 28);
      context.lineTo(x, 42);
      context.lineTo(x + 11, 28);
      context.fill();
    }
    // Daylight bar: the sun sets as the bar empties.
    const remaining = Math.max(0, DAYLIGHT_SECONDS - state.elapsed);
    context.fillStyle = 'rgba(255,255,255,0.3)';
    context.fillRect(24, FIELD.height - 22, 260, 10);
    context.fillStyle = remaining < 20 ? '#ff9f5a' : '#ffd94d';
    context.fillRect(24, FIELD.height - 22, 260 * (remaining / DAYLIGHT_SECONDS), 10);
    text(`Daylight ${Math.ceil(remaining)}s`, 292, FIELD.height - 26, 18, PALETTE.text, 'left');
    text(bestLabel(best), FIELD.width - 24, FIELD.height - 26, 18, PALETTE.muted, 'right');
    if (state.bee.shield) text('SHIELD', 24, 62, 18, '#7fd4ff', 'left');
    if (state.bee.swift > 0) text('SWIFT WINGS', 110, 62, 18, '#ff9f5a', 'left');
    void EVENT_BLOOM;
  }

  function drawPanel(title, lines, prompt) {
    const height = PANEL.top + lines.length * PANEL.line + PANEL.bottom;
    const x = (FIELD.width - PANEL.width) / 2;
    const y = (FIELD.height - height) / 2;
    context.fillStyle = 'rgba(32, 48, 28, 0.92)';
    context.fillRect(x, y, PANEL.width, height);
    context.strokeStyle = PALETTE.gold;
    context.lineWidth = 3;
    context.strokeRect(x, y, PANEL.width, height);
    context.textBaseline = 'alphabetic';
    text(title, FIELD.width / 2, y + 76, 46, PALETTE.text, 'center');
    for (let index = 0; index < lines.length; index += 1) {
      text(lines[index], FIELD.width / 2, y + PANEL.top + index * PANEL.line, 21, PALETTE.muted, 'center');
    }
    text(prompt, FIELD.width / 2, y + height - 38, 23, PALETTE.gold, 'center');
  }

  const TITLE_LINES = [
    'Bloom all 12 flowers before dusk to win.',
    'Collect golden pollen, brush a bud to bloom it.',
    'Dodge the wasps — three stings and the day is done.',
    'Move with WASD or arrows, hold the mouse to steer,',
    'click or Shift to dash. P pauses, M mutes.',
    '',
  ];
  const PAUSED_LINES = ['The wasps will wait for you.'];
  const WIN_LINES = ['', '', ''];
  const LOSE_LINES = ['', '', ''];

  /** Paint one frame: the field, then the HUD or a panel for the screen the game is on. */
  function draw(state, screen, best, time) {
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = '#20301c';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.setTransform(view.scale, 0, 0, view.scale, view.x, view.y);
    drawField(state, time);
    if (screen === SCREEN_TITLE) {
      TITLE_LINES[5] = bestLabel(best);
      drawPanel('Bloomkeeper', TITLE_LINES, 'Press Space or click to start');
      return;
    }
    drawHud(state, best);
    if (screen === SCREEN_PAUSED) drawPanel('Paused', PAUSED_LINES, 'Press P to resume');
    else if (screen === SCREEN_OVER) {
      if (state.won) {
        WIN_LINES[0] = finalLabel(state.score);
        WIN_LINES[1] = `All ${FLOWERS_TOTAL} flowers bloomed before dusk!`;
        WIN_LINES[2] = bestLabel(best);
        drawPanel('Garden in Bloom!', WIN_LINES, 'Press Space or click to play again');
      } else {
        LOSE_LINES[0] = finalLabel(state.score);
        LOSE_LINES[1] = state.overReason === 'dusk'
          ? `Dusk fell with ${state.blooms} of ${FLOWERS_TOTAL} flowers bloomed.`
          : `Stung out with ${state.blooms} of ${FLOWERS_TOTAL} flowers bloomed.`;
        LOSE_LINES[2] = bestLabel(best);
        drawPanel('Game over', LOSE_LINES, 'Press Space or click to play again');
      }
    }
  }

  resize();
  window.addEventListener('resize', resize);
  return { draw };
}

// ---- shots.js (deps: config.js, world.js, render.js) ----
// The screenshot scenes behind ?shot=start|play|bloom|end|win. Each one
// plays the real rules forward from a fresh world for a fixed number of
// steps, steered by a simple autopilot (collect pollen, then bloom the
// nearest bud, while keeping clear of wasps), so the frame is what a short
// game really looks like and the same seed always gives the same frame.





const START_SECONDS = 5;
const PLAY_SECONDS = 20;
const BLOOM_SECONDS = 45;
const MID_SECONDS = 28;
const END_LIMIT_SECONDS = 600;
const WIN_LIMIT_SECONDS = 600;

/** How far ahead, in seconds, the autopilot checks a wasp: the play and win
 *  pilots look well ahead and keep their hearts; the end pilot looks only a
 *  moment ahead, so it is caught out as a hurried player is. */
const HORIZON_PLAY = 50;
const HORIZON_WIN = 50;
const HORIZON_END = 50;
/** Steer toward the goal (pollen, then the nearest bud), unless a wasp is too close.
 *  `horizon` is the flee radius: a careful pilot flees from far away, a hurried
 *  one only at the last moment, so it is caught out. */
function autopilot(world, horizon) {
  const state = world.state;
  const bee = state.bee;
  const target = state.pollenCarried === 0 ? world.nearestPollen() : world.nearestUnbloomedFlower();
  const goal = target === null ? { x: FIELD.width / 2, y: FIELD.height / 2 } : target;
  const dx = goal.x - bee.x;
  const dy = goal.y - bee.y;
  const length = Math.hypot(dx, dy) || 1;
  const wanted = { x: dx / length, y: dy / length };
  const nearest = world.nearestWasp();
  if (nearest !== null && Math.hypot(nearest.x - bee.x, nearest.y - bee.y) < horizon) {
    // Flee: run directly away from the wasp.
    const away = { x: (bee.x - nearest.x) / horizon, y: (bee.y - nearest.y) / horizon };
    const awayLength = Math.hypot(away.x, away.y) || 1;
    return { x: away.x / awayLength, y: away.y / awayLength };
  }
  return wanted;
}

/** Run the world forward for `seconds`, steered by the autopilot, until it ends. */
function simulate(world, seconds, horizon) {
  for (let index = 0; index < seconds / STEP; index += 1) {
    const steer = autopilot(world, horizon);
    if (world.step(STEP, steer, false, false) & EVENT_OVER) break;
  }
}

/**
 * Set `world` to the named scene and return the screen to draw over it and
 * the best score to show. Unknown names stage the title scene.
 */
function stageShot(name, world) {
  world.reset();
  if (name === 'play') {
    simulate(world, PLAY_SECONDS, HORIZON_PLAY);
    return { screen: world.state.over ? SCREEN_OVER : SCREEN_PLAY, best: world.state.score };
  }
  if (name === 'bloom') {
    simulate(world, BLOOM_SECONDS, HORIZON_PLAY);
    return { screen: world.state.over ? SCREEN_OVER : SCREEN_PLAY, best: world.state.score };
  }
  if (name === 'mid') {
    simulate(world, MID_SECONDS, HORIZON_PLAY);
    return { screen: world.state.over ? SCREEN_OVER : SCREEN_PLAY, best: world.state.score };
  }
  if (name === 'end') {
    simulate(world, END_LIMIT_SECONDS, HORIZON_END);
    return { screen: SCREEN_OVER, best: world.state.score };
  }
  if (name === 'win') {
    simulate(world, WIN_LIMIT_SECONDS, HORIZON_WIN);
    return { screen: SCREEN_OVER, best: world.state.score };
  }
  for (let index = 0; index < START_SECONDS / STEP; index += 1) world.step(STEP, null, false, true);
  return { screen: SCREEN_TITLE, best: 0 };
}

// ---- main.js (deps: config.js, random.js, audio.js, world.js, input.js, render.js, shots.js) ----
// Bloomkeeper: boot and the one loop. Input is read every frame, the world
// advances in fixed 1/60 s steps (several in a slow frame, none in a fast
// one), and the renderer paints what is there. The game moves between four
// screens: title, play, paused and game over.
//
// ?seed=N fixes the garden's pattern. ?shot=start|play|bloom|end|win (with
// &seed=N) stages that scene instead of running the loop, paints it twice
// and sets window.__shotReady for a screenshot.








/** The longest frame the loop catches up on; a longer stall (a hidden tab) is dropped, not replayed. */
const MAX_FRAME = 0.25;

const params = new URLSearchParams(window.location.search);
const shot = params.get('shot');
const seedParam = Number.parseInt(params.get('seed') ?? '', 10);
const seed = Number.isInteger(seedParam) ? seedParam : Math.floor(Math.random() * 4294967296);

const canvas = document.getElementById('game');
const status = document.getElementById('status');
const world = createWorld(createRandom(seed));
const renderer = createRenderer(canvas);
const audio = createAudio();

function readBest() {
  try {
    return Number.parseInt(window.localStorage.getItem(BEST_KEY) ?? '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    window.localStorage.setItem(BEST_KEY, String(value));
  } catch {
    // Storage can be off (private windows): the best score then lasts this visit only.
  }
}

function runShot(name) {
  const scene = stageShot(name, world);
  let painted = 0;
  function paint() {
    renderer.draw(world.state, scene.screen, scene.best, world.state.elapsed);
    painted += 1;
    if (painted < 2) requestAnimationFrame(paint);
    else window.__shotReady = true;
  }
  requestAnimationFrame(paint);
}

function runGame() {
  const input = createInput(canvas);
  let screen = SCREEN_TITLE;
  let best = readBest();
  let accumulator = 0;
  let last = performance.now();

  function announce(message) {
    status.textContent = message;
  }

  function startGame() {
    world.reset();
    accumulator = 0;
    screen = SCREEN_PLAY;
    audio.unlock();
    audio.startMusic();
    announce('Playing. Bloom all 12 flowers before dusk.');
  }

  function endGame() {
    screen = SCREEN_OVER;
    if (world.state.score > best) {
      best = world.state.score;
      saveBest(best);
    }
    if (world.state.won) audio.win();
    else audio.lose();
    announce(world.state.won
      ? `Garden in bloom! Score ${world.state.score}. Best ${best}.`
      : `Game over. Score ${world.state.score}. Best ${best}.`);
  }

  function handleActions() {
    const actions = input.takeActions();
    if (actions & ACTION_MUTE) {
      const muted = audio.toggleMute();
      announce(muted ? 'Sound off.' : 'Sound on.');
    }
    if (actions & ACTION_CONFIRM && (screen === SCREEN_TITLE || screen === SCREEN_OVER)) startGame();
    else if (actions & ACTION_PAUSE && screen === SCREEN_PLAY) {
      screen = SCREEN_PAUSED;
      announce('Paused.');
    } else if (actions & (ACTION_PAUSE | ACTION_CONFIRM) && screen === SCREEN_PAUSED) {
      screen = SCREEN_PLAY;
      announce('Playing.');
    }
  }

  function steer() {
    const keys = input.keyDirection();
    if (keys !== null) return keys;
    if (input.pointerActive()) {
      const pointer = input.pointerPosition();
      const rect = canvas.getBoundingClientRect();
      const scaleX = FIELD.width / rect.width;
      const scaleY = FIELD.height / rect.height;
      const targetX = pointer.x * scaleX;
      const targetY = pointer.y * scaleY;
      const dx = targetX - world.state.bee.x;
      const dy = targetY - world.state.bee.y;
      const length = Math.hypot(dx, dy);
      if (length > 12) return { x: dx / length, y: dy / length };
    }
    return null;
  }

  function playEvents(events) {
    if (events & EVENT_COLLECT) audio.collect();
    if (events & EVENT_BLOOM) audio.bloom();
    if (events & EVENT_DASH) audio.dash();
    if (events & EVENT_POWERUP) audio.shield();
    if (events & EVENT_HIT) {
      audio.sting();
      announce(world.state.hearts === 1 ? 'Stung! 1 heart left.' : `Stung! ${world.state.hearts} hearts left.`);
    }
    if (events & EVENT_WIN) announce('Garden in bloom!');
  }

  function step() {
    if (screen === SCREEN_TITLE) {
      world.step(STEP, null, false, true);
      return;
    }
    const actions = input.takeActions();
    const dash = Boolean(actions & ACTION_DASH);
    const events = world.step(STEP, steer(), dash, false);
    playEvents(events);
    if (events & EVENT_OVER) endGame();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    accumulator += Math.min((now - last) / 1000, MAX_FRAME);
    last = now;
    handleActions();
    if (screen === SCREEN_TITLE || screen === SCREEN_PLAY) {
      while (accumulator >= STEP && (screen === SCREEN_TITLE || screen === SCREEN_PLAY)) {
        step();
        accumulator -= STEP;
      }
    } else {
      accumulator = 0;
    }
    renderer.draw(world.state, screen, best, world.state.elapsed);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && screen === SCREEN_PLAY) {
      screen = SCREEN_PAUSED;
      announce('Paused.');
    }
  });

  announce('Bloomkeeper. Press Space or click to start.');
  requestAnimationFrame(frame);
}

if (shot) runShot(shot);
else runGame();

</script>
</body>
